<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tribuna</title>
<meta name="description" content="Placares de futebol, tênis e Fórmula 1 de quem você escolhe. Sem anúncio.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<script>
// Tema escolhido em Ajustes (auto segue o aparelho). Vem antes do CSS para a tela nao piscar.
(function () {
  var t = 'auto';
  try { t = (JSON.parse(localStorage.getItem('tribuna.v1') || '{}').tema) || 'auto'; } catch (e) {}
  var claro = t === 'claro' || (t === 'auto' && window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches);
  document.documentElement.dataset.tema = claro ? 'claro' : 'escuro';
  document.write('<meta name="theme-color" content="' + (claro ? '#ECEFF5' : '#000000') + '">' +
    '<meta name="color-scheme" content="' + (claro ? 'light' : 'dark') + '">' +
    '<meta name="apple-mobile-web-app-status-bar-style" content="' + (claro ? 'default' : 'black-translucent') + '">');
})();
</script>
<meta name="apple-mobile-web-app-title" content="Tribuna">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://webws.365scores.com">
<link rel="preconnect" href="https://imagecache.365scores.com">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="onboarding" hidden></div>
<div id="shell">
  <nav id="nav" aria-label="Principal"></nav>
  <main id="main" tabindex="-1"></main>
  <aside id="detail" aria-label="Detalhes"></aside>
</div>
<div id="sheet" hidden></div>
<div id="toast" role="status" aria-live="polite"></div>
<script src="config.js"></script>
<script src="fontes.js"></script>
<script src="f1vivo.js"></script>
<script src="app.js"></script>
</body>
</html>
